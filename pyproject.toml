[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "revolver"
version = "0.0.1"
description = "Deterministic, stdlib-only repair-path generator for sentry diagnoses."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["revolver"]

[tool.pytest]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
ignore_missing_imports = true
