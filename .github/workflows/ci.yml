name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install -e . pytest==8.3.4 ruff==0.13.3 mypy==1.19.1
      - name: pytest
        run: pytest tests/ -x -q
      - name: ruff
        run: ruff check revolver/
      - name: mypy
        run: mypy revolver/ --ignore-missing-imports
